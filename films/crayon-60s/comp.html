<body>

<script>
// ════════════════════════════════════════════════════════════════════════════════════════════════
// CONCEPT — 一支蜡笔画出世界. A child's crayon is the cause of every colour in the film. A baby's world is black and
// white until one red dot; the crayon draws a balloon, a sun and a blue line; the camera dives into the line and it is
// water; ink drops bloom in it; the water rises into a wave and the camera rides the crest up into the sky, where the
// drawn balloon is now real. It bursts into paint, and on every hit the paint is seen through another era's colour.
// The vortex collapses to a point and opens on pastel silk, where an older hand draws with the same crayon, worn short.
// The line gathers into a point of light, the light goes through a prism, and the spectrum is a crayon rainbow on the
// child's page. No words anywhere.
//
//  t            beat                      what carries into the next beat
//  0.0–4.6      baby vision: B/W mobile, focus pulls; 3.0 one red dot; push into it       the red dot
//  4.6–10.0     pull back: the dot is the crayon's first mark; balloon · sun · waves        the blue line
//  10.0–11.0    dive into the blue line until it is water                                   the blue
//  11.0–21.0    flowing water; 15–19.5 ink drops fall and bloom on the beat                  the water
//  21.0–22.6    the water rises into a wave; the camera rides the crest up                  the crest → sky
//  22.6–30.0    sky; the balloon rises; push in; 29.3–30.0 dead still                        the balloon
//  30.0–42.0    POP — paint; every hit is another era's colour; 38–42 one vortex            the paint
//  42.0–51.8    iris opens on pastel silk; an older hand, the same crayon worn short        the line
//  51.8–57.0    the line gathers into light; light → prism → 55.0 spectrum                  the spectrum
//  57.0–60.0    the spectrum is the crayon rainbow on the child's page; pull back; still
// ════════════════════════════════════════════════════════════════════════════════════════════════
const W=1920, H=1080, DUR=60;
window.__meta={dur:DUR,fps:30,w:W,h:H,
  cuts:[22.0,30.0,31.5,32.5,33.5,34.25,35.0,35.5,36.0,36.25,36.5,36.75,37.0,37.25,37.5,37.75,38.0,42.0],
  inFrame:{dot:[3.1,4.0],balloon:[24.2,30.0,'whole'],prism:[54.0,56.9,'whole']}};
const {clamp,lerp,seg,sstep,ssstep,spring,ring,rng,ease}=OM;
const HITS=[[3.0,3,10],[22.0,16,6],[30.0,26,5],[31.5,10,9],[32.5,10,9],[33.5,12,9],[34.25,8,10],[35.0,8,10],[35.5,8,10],
  [36.0,6,12],[36.5,6,12],[37.0,6,12],[37.5,6,12],[38.0,14,7],[40.0,18,6],[42.0,10,8],[55.0,14,5]];

// ───────────────────────────── canvas ─────────────────────────────
const DPR=window.devicePixelRatio||1;
const cv=document.getElementById('cv'); cv.width=W*DPR; cv.height=H*DPR;
const g=cv.getContext('2d');
const setM=m=>g.setTransform(m[0]*DPR,m[1]*DPR,m[2]*DPR,m[3]*DPR,m[4]*DPR,m[5]*DPR);
const scr=()=>g.setTransform(DPR,0,0,DPR,0,0);
const mul=(A,B)=>[A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]];
const proj=(M,x,y)=>[M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]];
// world point (cx,cy) at screen centre, zoom z, rotation r
const camM=(cx,cy,z,r=0,sx=0,sy=0)=>{const c=Math.cos(r)*z,s=Math.sin(r)*z;return [c,s,-s,c,W/2+sx-(c*cx-s*cy),H/2+sy-(s*cx+c*cy)];};

// ───────────────────────────── colour ─────────────────────────────
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mixc=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,a[2]+(b[2]-a[2])*k];
const css=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function ramp(v,S){ if(v<=S[0][0]) return S[0][1]; for(let i=1;i<S.length;i++){ if(v<=S[i][0]){ const k=(v-S[i-1][0])/(S[i][0]-S[i-1][0]); return mixc(S[i-1][1],S[i][1],k*k*(3-2*k)); } } return S[S.length-1][1]; }
const rampOf=(hs)=>hs.map((h,i)=>[i/(hs.length-1),hex(h)]);
const rampMix=(A,B,k)=>A.map((s,i)=>[s[0],mixc(s[1],B[i][1],k)]);
function hsl(h,s,l){ h=((h%1)+1)%1; const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1));}; return [f(0)*255,f(8)*255,f(4)*255]; }

// ───────────────────────────── noise (deterministic) ─────────────────────────────
function h3(x,y,z){ let h=Math.imul(x,0x27d4eb2d)^Math.imul(y,0x165667b1)^Math.imul(z,0x2f6b0e4d); h=Math.imul(h^(h>>>15),0x85ebca6b); h^=h>>>13; h=Math.imul(h,0xc2b2ae35); h^=h>>>16; return (h>>>0)/4294967296; }
function vn(x,y,z){ const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z); let fx=x-X,fy=y-Y,fz=z-Z;
  fx=fx*fx*fx*(fx*(fx*6-15)+10); fy=fy*fy*fy*(fy*(fy*6-15)+10); fz=fz*fz*(3-2*fz);
  const a=h3(X,Y,Z),b=h3(X+1,Y,Z),c=h3(X,Y+1,Z),d=h3(X+1,Y+1,Z),e=h3(X,Y,Z+1),f=h3(X+1,Y,Z+1),p=h3(X,Y+1,Z+1),q=h3(X+1,Y+1,Z+1);
  const l0=a+(b-a)*fx,l1=c+(d-c)*fx,l2=e+(f-e)*fx,l3=p+(q-p)*fx, m0=l0+(l1-l0)*fy, m1=l2+(l3-l2)*fy; return m0+(m1-m0)*fz; }
function fbm(x,y,z,o){ let s=0,a=0.5,f=1,n=0; for(let i=0;i<o;i++){ s+=a*vn(x*f+i*17.3,y*f-i*9.1,z*f); n+=a; a*=0.5; f*=2.03; } return s/n; }
const h1=i=>h3(i,i*7+3,11);

// clocks: ∫ speed dt, integrated once at 240 Hz, sampled — so a field can slow to a dead stop and seek stays pure
function clock(speed,t0=0,t1=DUR){ const dt=1/240,N=Math.ceil((t1-t0)/dt)+2,T=new Float64Array(N); for(let i=1;i<N;i++) T[i]=T[i-1]+speed(t0+(i-0.5)*dt)*dt;
  return t=>{ const x=clamp((t-t0)/dt,0,N-1.001),i=Math.floor(x); return T[i]+(T[i+1]-T[i])*(x-i); }; }
const tauW=clock(t=>0.22+0.35*sstep(13.8,15.2,t)+0.45*sstep(19.6,21.2,t));
const tauS=clock(t=>0.16*(1-sstep(28.3,29.3,t)));
const tauP=clock(t=>0.13*(1-sstep(49.8,50.6,t)));

// low-res field buffers
function low(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); return {c,x,img:x.createImageData(w,h),w,h}; }
const LW=low(400,225), LS=low(320,180), LP=low(320,180), LB=low(480,270);
function blitLow(L,m,alpha=1){ L.x.putImageData(L.img,0,0); if(m) setM(m); else scr(); g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high'; g.globalAlpha=alpha; g.drawImage(L.c,0,0,W,H); g.globalAlpha=1; }

// fixed grain (in device px) — stops gradients banding in 8-bit, and never moves
const GRAIN=(()=>{ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d'), im=x.createImageData(256,256), r=rng(77);
  for(let i=0;i<256*256;i++){ const v=r()<0.5?0:255; im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v; im.data[i*4+3]=Math.floor(r()*9); } x.putImageData(im,0,0); return c; })();
// paper tooth: specks and fibres, tiled in world space
const PAPER=(()=>{ const c=document.createElement('canvas'); c.width=c.height=512; const x=c.getContext('2d'), r=rng(5);
  for(let i=0;i<9000;i++){ x.fillStyle=r()<0.5?'rgba(120,100,70,.06)':'rgba(255,255,255,.35)'; x.fillRect(r()*512,r()*512,1+r()*1.6,1+r()*1.6); }
  x.lineWidth=0.6; for(let i=0;i<160;i++){ x.strokeStyle='rgba(140,120,90,.07)'; x.beginPath(); const a=r()*6.28,px=r()*512,py=r()*512,l=8+r()*26; x.moveTo(px,py); x.quadraticCurveTo(px+Math.cos(a+.5)*l*.5,py+Math.sin(a+.5)*l*.5,px+Math.cos(a)*l,py+Math.sin(a)*l); x.stroke(); }
  return c; })();
let PAPERPAT=null, GRAINPAT=null, HALFTONE=null;
function grain(a=1){ scr(); g.setTransform(1,0,0,1,0,0); g.globalAlpha=a; g.fillStyle=GRAINPAT; g.fillRect(0,0,cv.width,cv.height); g.globalAlpha=1; scr(); }
function vignette(a=0.35,col='0,0,0'){ scr(); const r=g.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*1.05); r.addColorStop(0,`rgba(${col},0)`); r.addColorStop(1,`rgba(${col},${a})`); g.fillStyle=r; g.fillRect(0,0,W,H); }

// ───────────────────────────── crayon strokes ─────────────────────────────
// a path is points every ~3 px with normals; drawn as hair lines across the width that skip where the paper tooth
// catches (飞白), coloured along its length.
function mkPath(fn,n,colors){ const P=[]; for(let i=0;i<=n;i++){ const [x,y]=fn(i/n); P.push({x,y}); }
  for(let i=0;i<=n;i++){ const a=P[Math.max(0,i-1)],b=P[Math.min(n,i+1)],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1; P[i].nx=-dy/l; P[i].ny=dx/l; }
  return {P,n,colors:colors.map(hex)}; }
const pathCol=(p,u)=>{ const C=p.colors; if(C.length===1) return C[0]; const x=clamp(u)*(C.length-1),i=Math.min(C.length-2,Math.floor(x)); return mixc(C[i],C[i+1],x-i); };
const pathAt=(p,u)=>{ const x=clamp(u)*p.n,i=Math.min(p.n-1,Math.floor(x)),k=x-i,a=p.P[i],b=p.P[i+1]; return [lerp(a.x,b.x,k),lerp(a.y,b.y,k)]; };
function crayon(p,u0,u1,w,seed=1,alpha=1){
  if(u1<=u0) return; const HAIR=11, i0=Math.floor(clamp(u0)*p.n), i1=Math.min(p.n,Math.ceil(clamp(u1)*p.n)), CH=6;
  g.lineCap='round'; g.lineJoin='round';
  for(let c=i0;c<i1;c+=CH){ const e=Math.min(i1,c+CH), col=pathCol(p,(c+CH/2)/p.n);
    for(let h=0;h<HAIR;h++){ const o=(h/(HAIR-1)-0.5), off=o*w, edge=Math.abs(o)*2;
      g.strokeStyle=css(mixc(col,[0,0,0],0.08*h1(h+seed)),alpha*(0.5+0.35*(1-edge))); g.lineWidth=w/HAIR*1.9; g.beginPath(); let down=false;
      for(let i=c;i<=e;i++){ const q=p.P[i]; const skip=h3(h*31+seed,i>>1,seed)<0.1+0.3*edge*edge; const x=q.x+q.nx*off, y=q.y+q.ny*off;
        if(skip){ down=false; continue; } if(!down){ g.moveTo(x,y); down=true; } else g.lineTo(x,y); }
      g.stroke(); } }
  g.globalAlpha=1; }

// the child's page (world = 1920×1080 paper)
const BAL={x:820,y:400,rx:108,ry:128};
const P_BAL=mkPath(u=>{ const a=u*Math.PI*2*1.12, w=1+0.035*Math.sin(5*a)+0.02*u; return [BAL.x+Math.cos(a)*BAL.rx*w, BAL.y-Math.sin(a)*BAL.ry*w]; },420,['#e8202c','#f0303a','#d9162a']);
const P_STR=mkPath(u=>[BAL.x-4+Math.sin(u*Math.PI*3.2)*18*(1-u*0.3)-u*20, BAL.y+BAL.ry+6+u*300],160,['#c81a2a']);
const SUN={x:1440,y:250};
const P_SUN=mkPath(u=>{ const a=u*Math.PI*2*5.2, r=14+62*Math.pow(u,0.7)+6*Math.sin(a*3); return [SUN.x+Math.cos(a)*r, SUN.y+Math.sin(a)*r*0.92]; },520,['#ffd21a','#ffb21a','#ff8a1e','#ff6a1e']);
const waveY=x=>860+26*Math.sin(2*Math.PI*x/190);
const P_WAV=mkPath(u=>{ const x=220+u*1480; return [x,waveY(x)]; },600,['#1f5fe0','#1d7bea','#1aa0e0','#19b9cf']);
const P_RB=[...Array(7)].map((_,i)=>mkPath(u=>{ const a=Math.PI+u*Math.PI, r=240-i*14; return [1350+Math.cos(a)*r, 720+Math.sin(a)*r*0.9]; },220,
  [['#e8202c'],['#ff7a1a'],['#ffd21a'],['#2fbf4a'],['#1d7bea'],['#3f3fd6'],['#8a3fd6']][i]));
// drawing windows
const D_BAL=[5.5,6.6], D_STR=[6.62,7.0], D_SUN=[7.15,7.9], D_WAV=[8.25,9.95];
const kBal=t=>ease.sineInOut(seg(t,...D_BAL)), kStr=t=>seg(t,...D_STR), kSun=t=>ease.smooth(seg(t,...D_SUN)), kWav=t=>ease.sineInOut(seg(t,...D_WAV));
const dotW=[BAL.x+BAL.rx, BAL.y];      // the first red dot is where the balloon stroke starts
function page(t,full){ // paper + everything drawn by t (full = the finished page)
  g.fillStyle='#f7f2e8'; g.fillRect(-4000,-4000,9920,9080); g.fillStyle=PAPERPAT; g.fillRect(-4000,-4000,9920,9080);
  const f=u=>full?1:u;
  crayon(P_BAL,0,f(kBal(t)),15,3); crayon(P_STR,0,f(kStr(t)),7,4); crayon(P_SUN,0,f(kSun(t)),11,5); crayon(P_WAV,0,f(kWav(t)),15,6);
  g.fillStyle='#e8202c'; g.beginPath(); g.arc(dotW[0],dotW[1],full?0:9,0,7); g.fill();
}

// ───────────────────────────── the hand ─────────────────────────────
function blobE(x,y,rx,ry,rot,fill){ g.beginPath(); g.ellipse(x,y,rx,ry,rot,0,Math.PI*2); g.fillStyle=fill; g.fill(); }
function drawHand(x,y,{kind='child',col=[232,32,44],lift=0,sc=1,ang=-0.9}={}){
  const elder=kind==='elder', L=elder?78:190;
  const skin=elder?'#e3bc9e':'#f4c9a8', skin2=elder?'#cf9f80':'#e9aa86';
  g.save(); g.translate(x,y); g.rotate(ang); g.scale(sc*(1+lift*0.06),sc*(1+lift*0.06));
  // shadow on the paper grows with the lift
  g.save(); g.translate(16+lift*40,26+lift*50); g.globalAlpha=0.13*(1-lift*0.4); g.filter=`blur(${(10+lift*14)*sc}px)`;
  blobE(110,44,70,58,0.2,'#000'); g.fillStyle='#000'; g.fillRect(20,-12,L,24); g.fillRect(150,-10,900,120); g.restore(); g.filter='none'; g.globalAlpha=1;
  // sleeve
  g.save(); g.translate(170,40); g.rotate(-0.22);
  if(elder){ g.fillStyle='#cdbfa8'; g.beginPath(); g.roundRect(0,-58,900,150,44); g.fill(); g.strokeStyle='rgba(120,100,80,.25)'; g.lineWidth=3; for(let i=0;i<50;i++){ g.beginPath(); g.moveTo(14+i*16,-54); g.lineTo(14+i*16,88); g.stroke(); } }
  else { g.fillStyle='#ffffff'; g.beginPath(); g.roundRect(0,-58,900,150,44); g.fill(); g.save(); g.clip(); for(let i=0;i<26;i++){ g.fillStyle=i%2?'#ffd21a':'#2f6fe0'; g.fillRect(24+i*34,-70,17,180); } g.restore(); }
  g.restore();
  // palm
  { const rg=g.createRadialGradient(90,20,10,110,44,90); rg.addColorStop(0,skin); rg.addColorStop(1,skin2); blobE(112,44,elder?66:70,elder?52:58,0.2,rg); }
  // crayon
  const cd=mixc(col,[0,0,0],0.25), cl=mixc(col,[255,255,255],0.25);
  g.fillStyle=css(cd); g.beginPath(); g.moveTo(0,0); g.lineTo(26,-11); g.lineTo(26,11); g.closePath(); g.fill();
  const lg=g.createLinearGradient(0,-12,0,12); lg.addColorStop(0,css(cl)); lg.addColorStop(0.5,css(col)); lg.addColorStop(1,css(cd));
  g.fillStyle=lg; g.beginPath(); g.roundRect(24,-12,L-24,24,[2,6,6,2]); g.fill();
  if(!elder){ g.fillStyle=css(mixc(col,[255,255,255],0.55)); g.fillRect(52,-12,L-66,24); g.fillStyle=css(cd,0.8); g.fillRect(60,-12,4,24); g.fillRect(L-24,-12,4,24); }
  else { g.fillStyle=css(mixc(col,[255,255,255],0.4)); g.fillRect(44,-12,L-50,24); }
  // fingers over the crayon, thumb
  const fg=g.createLinearGradient(40,-40,40,10); fg.addColorStop(0,skin); fg.addColorStop(1,skin2);
  blobE(64,-16,21,17,0.1,fg); blobE(90,-22,22,18,0.1,fg); blobE(116,-18,21,17,0.15,fg);
  if(elder){ g.strokeStyle='rgba(120,80,60,.35)'; g.lineWidth=2; for(const [fx,fy] of [[64,-16],[90,-22],[116,-18]]){ g.beginPath(); g.arc(fx,fy+4,9,3.6,5.8); g.stroke(); } }
  blobE(72,20,30,15,-0.35,skin);
  g.restore();
}

// ───────────────────────────── S1 · baby vision ─────────────────────────────
function s1(t){
  scr(); g.fillStyle='#f3f1ec'; g.fillRect(0,0,W,H);
  const zin=ease.expoIn(seg(t,4.0,4.6)), Z=Math.exp(Math.log(62)*zin);
  const blur=36*(1-ssstep(0.6,2.7,t)), sway=sstep(0.6,1.4,t);
  const m=[Z,0,0,Z,960-960*Z,540-540*Z]; setM(m);
  g.filter=blur>0.3?`blur(${blur.toFixed(1)}px)`:'none';
  g.strokeStyle='#161616'; g.lineWidth=4; g.beginPath(); g.moveTo(560,110); g.lineTo(1360,110); g.stroke();
  const items=[[620,440,0],[960,300,1],[1300,430,2]];
  items.forEach(([x,y,k],i)=>{ const a=sway*0.05*Math.sin(1.3*t+i*1.7), px=x+Math.sin(a)*(y-110), py=110+Math.cos(a)*(y-110);
    g.lineWidth=2.5; g.beginPath(); g.moveTo(x,110); g.lineTo(px,py-(k===1?80:85)); g.stroke();
    g.save(); g.translate(px,py); g.rotate(a);
    if(k===0){ g.fillStyle='#111'; g.beginPath(); g.arc(0,0,85,0,7); g.fill(); g.fillStyle='#f3f1ec'; g.beginPath(); g.arc(-22,-24,22,0,7); g.fill(); }
    if(k===1){ const sx=Math.cos(sway*0.9*Math.sin(0.8*t)); g.scale(Math.max(0.15,Math.abs(sx)),1); for(let r=0;r<4;r++)for(let c=0;c<4;c++){ g.fillStyle=(r+c)%2?'#111':'#f3f1ec'; g.fillRect(-80+c*40,-80+r*40,40,40);} g.strokeStyle='#111'; g.lineWidth=4; g.strokeRect(-80,-80,160,160); }
    if(k===2){ for(let r=85;r>0;r-=17){ g.fillStyle=(r/17)%2?'#111':'#f3f1ec'; g.beginPath(); g.arc(0,0,r,0,7); g.fill(); } }
    g.restore(); });
  g.filter='none';
  // the first colour
  const d=t<3.0?0:spring(t-3.0,0.45,16), im=OM.impact(t,3.0,{decay:6,omega:20,sqx:0.18,sqy:0.2});
  if(d>0){ g.fillStyle='#e8202c'; g.beginPath(); g.ellipse(960,540,22*d*im.sx,22*d*im.sy,0,0,7); g.fill(); }
  const warm=sstep(3.0,4.2,t)*0.12; if(warm>0){ scr(); g.fillStyle=`rgba(255,120,90,${warm})`; g.fillRect(0,0,W,H); }
  vignette(0.18);
}
// the fill that reaches the frame as the push lands
function s1track(t){ const Z=Math.exp(Math.log(62)*ease.expoIn(seg(t,4.0,4.6))), r=22*Z*(t<3?0:spring(t-3,0.45,16)); return {x:960-r,y:540-r,w:2*r,h:2*r}; }

// ───────────────────────────── S2 · the page ─────────────────────────────
const CAM2=[
  {t:4.6,x:dotW[0],y:dotW[1],zoom:1280/9},
  {t:5.55,x:dotW[0]-40,y:dotW[1]+20,zoom:1.75,curve:ease.expoOut},
  {t:6.6,x:BAL.x+10,y:BAL.y+70,zoom:1.6,curve:ease.sineInOut},

  else if(t<57){ if(t>53.3) T.prism={x:PRISM.x-190,y:PRISM.y-230,w:380,h:360}; }
  else { const k=ease.cubicInOut(seg(t,57,58.4)), z=Math.exp(lerp(Math.log(2.5),0,k)), M=camM(lerp(RB_TOP[0],960,k),lerp(RB_TOP[1],540,k),z); T.page=OM.projectBox(M,{x:0,y:0,w:W,h:H}); }
  return T;
}
function motion(t0,t1){
  const A=track(t0), B=track(t1); let d=0;
  for(const k in A) if(B[k]){ const a=A[k],b=B[k]; d=Math.max(d,Math.hypot(a.x-b.x,a.y-b.y),Math.hypot(a.x+a.w-b.x-b.w,a.y+a.h-b.y-b.h)); }
  if(t0>=30&&t1<42){ const P=blobsAt(t0), Q=blobsAt(t1); const m=new Map(Q.map(o=>[o.b,o])); for(const o of P){ const q=m.get(o.b); if(q) d=Math.max(d,Math.hypot(o.x-q.x,o.y-q.y)+Math.abs(o.r-q.r)); } }
  if(t0>=11&&t1<22.6) d=Math.max(d,(tauW(t1)-tauW(t0))*0.19*W*0.6);
  const s0=shakeAt(t0), s1=shakeAt(t1); d+=Math.hypot(s0.x-s1.x,s0.y-s1.y)*1.5;
  return d;
}

PAPERPAT=g.createPattern(PAPER,'repeat'); GRAINPAT=g.createPattern(GRAIN,'repeat');

window.__track=t=>track(t);
window.__motion=(t0,t1)=>motion(t0,t1);
